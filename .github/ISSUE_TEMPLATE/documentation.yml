name: 문서 개선
description: README, 매뉴얼, 예제 또는 링크의 문제를 제안합니다.
title: "[Docs] "
labels: [documentation]
body:
  - type: input
    id: location
    attributes:
      label: 문서 위치
      placeholder: README 빠른 시작 / docs/comparison.md / GitHub Pages URL
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 현재 문제
      description: 찾기 어려운 내용, 코드와 다른 결과, 깨진 명령이나 링크를 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 설명 또는 예제
    validations:
      required: true
  - type: checkboxes
    id: verification
    attributes:
      label: 확인
      options:
        - label: 예제 값은 현재 공개 API와 기본값을 기준으로 확인했습니다.
          required: true
        - label: 실제 사용자 transcript나 비공개 정보를 포함하지 않았습니다.
          required: true
