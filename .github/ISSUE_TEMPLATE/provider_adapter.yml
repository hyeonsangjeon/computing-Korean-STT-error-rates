name: Provider 출력 어댑터 제안
description: 공식 schema에 근거한 저장 출력 파서를 제안합니다.
title: "[Provider] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        실제 사용자 transcript, 음성, credential은 첨부하지 말고 합성 예제를 사용해 주세요.
  - type: input
    id: provider
    attributes:
      label: 공급자와 제품/API
      description: 자동 감지 이름이 아니라 공식 제품과 API 이름을 적어 주세요.
      placeholder: Microsoft Azure Speech short-audio REST
    validations:
      required: true
  - type: input
    id: schema
    attributes:
      label: 공식 schema URL과 version
      placeholder: https://... / API 2025-10-15
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: 입력 계약
      description: 평가 text, 필수·선택 필드, segment 결합, 빈 결과, 실패 상태, timestamp 단위를 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: synthetic
    attributes:
      label: 최소 합성 JSON
      render: json
    validations:
      required: true
  - type: textarea
    id: licensing
    attributes:
      label: 출처와 라이선스
      description: 공식 문서, fixture 작성 방식, 외부 코드·데이터 재사용 여부를 적어 주세요.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 확인
      options:
        - label: 네트워크, credential, 공급자 SDK, 모델 runtime 없이 파싱할 수 있습니다.
          required: true
        - label: 알 수 없는 schema와 malformed input을 fail-closed 처리할 수 있습니다.
          required: true
        - label: 실제 사용자·고객 transcript나 비공개 정보를 포함하지 않았습니다.
          required: true
