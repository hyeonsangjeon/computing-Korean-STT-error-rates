name: Test Python package

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest build twine

      - name: Run tests
        run: python -m pytest test -q

      - name: Build package
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Test extracted source distribution
        run: python .github/scripts/verify_sdist.py dist/*.tar.gz

      - name: Verify source installation and quick start
        run: |
          python -m pip uninstall -y nlptutti
          python -m pip install --force-reinstall dist/*.tar.gz
          python -m pip check
          smoke_dir="$(mktemp -d)"
          cd "${smoke_dir}"
          python "${GITHUB_WORKSPACE}/.github/scripts/smoke_installed_package.py"

      - name: Verify installed wheel and quick start
        run: |
          python -m pip uninstall -y nlptutti
          python -m pip install --force-reinstall dist/*.whl
          python -m pip check
          smoke_dir="$(mktemp -d)"
          cd "${smoke_dir}"
          python "${GITHUB_WORKSPACE}/.github/scripts/smoke_installed_package.py"

  type-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package and type checker
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "mypy>=1.11,<2"

      - name: Check typed package
        run: python -m mypy nlptutti

  compatibility:
    name: wheel (${{ matrix.os }}, Python ${{ matrix.python }}, ${{ matrix.jiwer }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.8"
            jiwer: "jiwer==3.0.0"
          - os: ubuntu-latest
            python: "3.12"
            jiwer: "jiwer>=3,<4"
          - os: windows-latest
            python: "3.12"
            jiwer: "jiwer>=4,<5"
          - os: macos-latest
            python: "3.12"
            jiwer: "jiwer>=4,<5"
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install build frontend
        run: python -m pip install build
      - name: Test isolated wheel with selected dependency
        run: python .github/scripts/verify_compatibility.py --jiwer "${{ matrix.jiwer }}"
